---
- name: Deploy and configure Nginx web server
  hosts: webservers
  become: yes
  vars:
    nginx_user: www-data
    welcome_message: "Добро пожаловать на сервер, управляемый Ansible!"
    company_name: "ТехноПрогресс"
  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
      tags: install

    - name: Ensure Nginx service is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
      tags: service

    - name: Deploy custom index.html
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <title>{{ company_name }} - {{ ansible_hostname }}</title>
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
                  h1 { color: #333; }
                  .info { background: #f4f4f4; padding: 20px; margin: 20px auto; width: 60%; border-radius: 10px; }
              </style>
          </head>
          <body>
              <h1>{{ welcome_message }}</h1>
              <div class="info">
                  <p><strong>Имя сервера:</strong> {{ ansible_hostname }}</p>
                  <p><strong>ОС:</strong> {{ ansible_distribution }} {{ ansible_distribution_version }}</p>
                  <p><strong>Дата настройки:</strong> {{ ansible_date_time.date }}</p>
                  <p><strong>Управляющая компания:</strong> {{ company_name }}</p>
              </div>
              <p>Этот сервер был автоматически настроен с помощью <strong>Ansible</strong>.</p>
          </body>
          </html>
        owner: "{{ nginx_user }}"
        group: "{{ nginx_user }}"
        mode: '0644'
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
