version: '3.8'

services:
  freeipa:
    image: freeipa/freeipa-server:almalinux-9
    container_name: freeipa-server
    hostname: ipa.astra.lab
    privileged: true
#    cgroupns: host
    restart: unless-stopped
    environment:
      - PASSWORD=FreeIPA2026!
      - IPA_SERVER_INSTALL_OPTS=--unattended --domain=astra.lab --realm=ASTRA.LAB --hostname=ipa.astra.lab -p FreeIPA2026! -a FreeIPA2026! --setup-dns --forwarder=8.8.8.8 --no-ntp --no-reverse
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/ipa-data:/data:Z
    ports:
      - "80:80"
      - "443:443"
      - "389:389"
      - "636:636"
      - "88:88"
      - "464:464"
      - "53:53"
      - "53:53/udp"
    command: --skip-mem-check
