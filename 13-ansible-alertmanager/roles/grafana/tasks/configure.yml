---
- name: Create configuration directory
  ansible.builtin.file:
    path: "{{ grafana_config_path }}"
    state: directory
    owner: root
    group: "{{ grafana_group }}"
    mode: '0750'

- name: Deploy grafana.ini config file
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_path }}/grafana.ini"
    owner: root
    group: "{{ grafana_group }}"
    mode: '0640'
  notify: restart grafana
