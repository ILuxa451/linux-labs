---
# Версия Alertmanager
alertmanager_version: "0.27.0"
alertmanager_architecture: amd64

# Сетевые настройки
alertmanager_web_listen_address: "0.0.0.0:9093"
alertmanager_cluster_enabled: false
alertmanager_cluster_listen_address: "0.0.0.0:9094"
alertmanager_cluster_peers: []

# Пользователь и пути
alertmanager_user: alertmanager
alertmanager_group: alertmanager
alertmanager_install_path: /opt/alertmanager
alertmanager_config_path: /etc/alertmanager
alertmanager_data_path: /var/lib/alertmanager

# Базовый конфиг (пока без Telegram, чтобы просто проверить запуск)
alertmanager_config:
  global:
    resolve_timeout: 5m
  route:
    receiver: 'default'
    group_by: ['alertname', 'job', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
  receivers:
    - name: 'default'
      webhook_configs:
        - url: "http://localhost:8080"
