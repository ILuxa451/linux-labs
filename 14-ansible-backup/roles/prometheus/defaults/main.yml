---
# Версия Prometheus (актуальная на момент написания)
prometheus_version: "2.51.2"
# Архитектура (amd64 для обычных ПК, arm64 для малины/серверов на ARM)
prometheus_architecture: amd64

# Порт, на котором работает веб-интерфейс Prometheus
prometheus_web_listen_address: "0.0.0.0:9090"

# Пользователь, от которого запускается процесс
prometheus_user: prometheus
prometheus_group: prometheus

# Директории
prometheus_install_path: /opt/prometheus
prometheus_config_path: /etc/prometheus
prometheus_data_path: /var/lib/prometheus

# Интервалы сбора метрик
prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s

# Таргеты для мониторинга (статическая конфигурация для теста)
prometheus_static_targets:
  - job_name: prometheus
    targets:
      - localhost:9090
  - job_name: node
    targets:
      - localhost:9100

# Параметры установки Node Exporter
node_exporter_install: true
node_exporter_version: "1.8.0"
node_exporter_port: 9100
