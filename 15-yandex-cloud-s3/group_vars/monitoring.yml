---
alertmanager_config:
  global:
    resolve_timeout: 5m
    telegram_api_url: "https://telegram.org"
    smtp_smarthost: "smtp.yandex.ru:587"
    smtp_from: "TestBokss@yandex.ru"
    smtp_auth_username: "{{ vault_smtp_username }}"
    smtp_auth_password: "{{ vault_smtp_password }}"
    smtp_require_tls: true

  route:
    receiver: 'critical-group'
    group_by: ['alertname', 'job', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - match:
          severity: critical
        receiver: critical-group
        continue: true

  receivers:
    - name: 'critical-group'
      telegram_configs:
        - bot_token: "{{ vault_telegram_bot_token }}"
          chat_id: "{{ vault_telegram_chat_id }}"
          parse_mode: 'HTML'
          send_resolved: true
          proxy_url: "http://192.168.3.100:8888"
      email_configs:
        - to: "TestBokss@yandex.ru"
          send_resolved: true

  inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'instance', 'job']
