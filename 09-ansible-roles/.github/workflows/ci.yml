name: Ansible Role CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
        ansible-version: ["2.14", "2.15"]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install Ansible
        run: |
          pip install ansible==${{ matrix.ansible-version }}
          pip install ansible-lint yamllint

      - name: Lint with yamllint
        run: yamllint .

      - name: Lint with ansible-lint
        run: ansible-lint .

      - name: Check syntax
        run: |
          find . -name "*.yml" -type f | xargs -I {} ansible-playbook --syntax-check {}
